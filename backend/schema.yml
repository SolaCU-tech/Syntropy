openapi: 3.0.3
info:
  title: Syntropy API
  version: 0.1.0
  description: Syntropy backend API. The frontend generates its TypeScript types from
    this.
paths:
  /api/health/:
    get:
      operationId: health_check
      description: 'Liveness check: the API is up and can reach PostgreSQL.'
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
components:
  schemas:
    DatabaseEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        database:
          $ref: '#/components/schemas/DatabaseEnum'
      required:
      - database
      - status
    StatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
