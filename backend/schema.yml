openapi: 3.1.0
info:
  title: Syntropy API
  version: 0.1.0
  description: Syntropy backend API. The frontend generates its TypeScript types from
    this.
paths:
  /api/auth/login/:
    post:
      operationId: auth_login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/session/:
    get:
      operationId: auth_session
      description: Who is signed in. Also sets the CSRF cookie the app sends back
        on every change.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/health/:
    get:
      operationId: health_check
      description: 'Liveness check: the API is up and can reach PostgreSQL.'
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/workspaces/:
    get:
      operationId: workspaces_list
      description: The workspaces the signed-in user belongs to, and creating a new
        one.
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
          description: ''
    post:
      operationId: workspaces_create
      description: The workspaces the signed-in user belongs to, and creating a new
        one.
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkspaceCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkspaceCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
  /api/workspaces/{workspace_id}/:
    get:
      operationId: workspaces_retrieve
      description: One workspace the signed-in user belongs to, with their role in
        it.
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
  /api/workspaces/{workspace_id}/schema/:
    get:
      operationId: workspace_schema_retrieve
      description: The workspace's active (published) schema as an SSD document. Read-only.
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSD'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/workspaces/{workspace_id}/sync/:
    post:
      operationId: sync_upload
      description: Upload a batch of changes queued on a device while it was offline.
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SyncBatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SyncBatchRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/workspaces/{workspace_id}/tables/:
    get:
      operationId: tables_list
      description: Record count and last change for every table in the active schema
        (Tables index).
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TableSummary'
          description: ''
  /api/workspaces/{workspace_id}/tables/{table_id}/lookup/:
    get:
      operationId: records_lookup
      description: IDs and titles of a table's records, for link pickers and the offline
        cache.
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Up to 5000; default 50.
      - in: query
        name: search
        schema:
          type: string
        description: Text to find in the text fields.
      - in: path
        name: table_id
        schema:
          type: string
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupItem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/workspaces/{workspace_id}/tables/{table_id}/records/:
    get:
      operationId: records_list
      description: Browse a table's records (newest first unless sorted) and create
        new ones.
      parameters:
      - in: query
        name: filter
        schema:
          type: string
        description: 'JSON filter tree: {"all": [{"field": "fld_x", "op": "gte", "value":
          "1000"}]}. Operators depend on the field type.'
      - in: query
        name: ordering
        schema:
          type: string
        description: A field ID, created_at or updated_at; prefix - for descending.
      - in: query
        name: page
        schema:
          type: integer
        description: Page number, from 1.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Up to 200; default 50.
      - in: query
        name: search
        schema:
          type: string
        description: Text to find in the text fields.
      - in: path
        name: table_id
        schema:
          type: string
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordPage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: records_create
      description: Browse a table's records (newest first unless sorted) and create
        new ones.
      parameters:
      - in: path
        name: table_id
        schema:
          type: string
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecordCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecordCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/workspaces/{workspace_id}/tables/{table_id}/records/{record_id}/:
    get:
      operationId: records_retrieve
      description: Read, edit or delete one record.
      parameters:
      - in: path
        name: record_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: table_id
        schema:
          type: string
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    patch:
      operationId: records_partial_update
      description: Read, edit or delete one record.
      parameters:
      - in: path
        name: record_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: table_id
        schema:
          type: string
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRecordUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRecordUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRecordUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordConflict'
          description: Stale version (with the current record) or a duplicate value.
    delete:
      operationId: records_destroy
      description: Read, edit or delete one record.
      parameters:
      - in: path
        name: record_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: table_id
        schema:
          type: string
        required: true
      - in: query
        name: version
        schema:
          type: integer
          minimum: 1
        description: If sent, a stale version returns 409.
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordDeleted'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
components:
  schemas:
    Cardinality:
      enum:
      - many_to_one
      - one_to_one
      title: Cardinality
      type: string
    DatabaseEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    DeletePolicy:
      enum:
      - restrict
      - cascade
      - set_null
      title: DeletePolicy
      type: string
    DisplayRole:
      description: How the UI, reports and insights should treat a field.
      enum:
      - title
      - money
      - quantity
      - status
      - date
      title: DisplayRole
      type: string
    EnumOption:
      additionalProperties: false
      properties:
        key:
          maxLength: 63
          pattern: ^[a-z][a-z0-9]*(_[a-z0-9]+)*$
          title: Key
          type: string
        label:
          maxLength: 120
          minLength: 1
          title: Label
          type: string
      required:
      - key
      - label
      title: EnumOption
      type: object
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
      required:
      - code
      - message
    FieldDef:
      additionalProperties: false
      properties:
        id:
          pattern: ^fld_[a-z0-9_]{3,48}$
          title: Id
          type: string
        key:
          maxLength: 63
          pattern: ^[a-z][a-z0-9]*(_[a-z0-9]+)*$
          title: Key
          type: string
        label:
          maxLength: 120
          minLength: 1
          title: Label
          type: string
        description:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          default: null
          title: Description
        type:
          $ref: '#/components/schemas/LogicalType'
        required:
          default: false
          title: Required
          type: boolean
        unique:
          default: false
          title: Unique
          type: boolean
        default:
          anyOf:
          - type: string
          - type: boolean
          - type: integer
          - type: 'null'
          default: null
          title: Default
        min_value:
          anyOf:
          - pattern: ^-?\d{1,28}(\.\d{1,10})?$
            type: string
          - type: 'null'
          default: null
          title: Min Value
        max_value:
          anyOf:
          - pattern: ^-?\d{1,28}(\.\d{1,10})?$
            type: string
          - type: 'null'
          default: null
          title: Max Value
        max_length:
          anyOf:
          - maximum: 10000
            minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Max Length
        precision:
          anyOf:
          - maximum: 28
            minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Precision
        scale:
          anyOf:
          - maximum: 10
            minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Scale
        currency:
          anyOf:
          - pattern: ^[A-Z]{3}$
            type: string
          - type: 'null'
          default: null
          title: Currency
        options:
          anyOf:
          - items:
              $ref: '#/components/schemas/EnumOption'
            maxItems: 100
            type: array
          - type: 'null'
          default: null
          title: Options
        display_role:
          anyOf:
          - $ref: '#/components/schemas/DisplayRole'
          - type: 'null'
          default: null
        provenance:
          anyOf:
          - $ref: '#/components/schemas/Provenance'
          - type: 'null'
          default: null
      required:
      - id
      - key
      - label
      - type
      title: FieldDef
      type: object
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        database:
          $ref: '#/components/schemas/DatabaseEnum'
      required:
      - database
      - status
    HealthStatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
    LogicalType:
      enum:
      - text
      - integer
      - decimal
      - boolean
      - date
      - datetime
      - enum
      - reference
      title: LogicalType
      type: string
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - password
      - username
    LookupItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type:
          - string
          - 'null'
          description: The title field, or null.
        version:
          type: integer
      required:
      - id
      - title
      - version
    OpEnum:
      enum:
      - create
      - update
      type: string
      description: |-
        * `create` - create
        * `update` - update
    OriginEnum:
      enum:
      - manual
      - ai
      - import
      type: string
    PatchedRecordUpdateRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
          description: The version you last read. A stale version returns 409.
        values:
          type: object
          additionalProperties:
            oneOf:
            - {}
            - type: 'null'
          description: Values keyed by SSD field ID. Decimals are strings ("1500.00"),
            dates are "YYYY-MM-DD", datetimes are ISO 8601 in UTC, and a reference
            field holds the linked record's ID. Only the fields sent change; null
            clears a field.
    Provenance:
      additionalProperties: false
      description: 'Where a field came from: who proposed it and from which source
        column.'
      properties:
        origin:
          allOf:
          - $ref: '#/components/schemas/OriginEnum'
          default: manual
          title: Origin
        source_file:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          default: null
          title: Source File
        source_column:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          default: null
          title: Source Column
        note:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          default: null
          title: Note
      title: Provenance
      type: object
    Record:
      type: object
      properties:
        id:
          type: string
          format: uuid
        table_id:
          type: string
        version:
          type: integer
          description: Send this back when editing the record.
        schema_version:
          type: integer
          description: The schema version the record was last written against.
        values:
          type: object
          additionalProperties:
            oneOf:
            - {}
            - type: 'null'
          description: Values keyed by SSD field ID. Decimals are strings ("1500.00"),
            dates are "YYYY-MM-DD", datetimes are ISO 8601 in UTC, and a reference
            field holds the linked record's ID.
        created_by:
          type:
          - integer
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - created_at
      - created_by
      - id
      - schema_version
      - table_id
      - updated_at
      - values
      - version
    RecordConflict:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
        current:
          allOf:
          - $ref: '#/components/schemas/Record'
          description: The record as it is now on the server.
      required:
      - code
      - current
      - message
    RecordCreateRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Optional client-generated ID (UUIDv7 from offline devices).
        values:
          type: object
          additionalProperties:
            oneOf:
            - {}
            - type: 'null'
          description: Values keyed by SSD field ID. Decimals are strings ("1500.00"),
            dates are "YYYY-MM-DD", datetimes are ISO 8601 in UTC, and a reference
            field holds the linked record's ID.
      required:
      - values
    RecordDeleted:
      type: object
      properties:
        deleted:
          type: array
          items:
            type: string
            format: uuid
          description: Every record removed, including any removed by a cascade.
      required:
      - deleted
    RecordPage:
      type: object
      properties:
        count:
          type: integer
          description: Records matching the filters, on all pages.
        next:
          type:
          - string
          - 'null'
          format: uri
          description: The next page, or null.
        previous:
          type:
          - string
          - 'null'
          format: uri
          description: The previous page, or null.
        results:
          type: array
          items:
            $ref: '#/components/schemas/Record'
      required:
      - count
      - next
      - previous
      - results
    Relationship:
      additionalProperties: false
      description: |-
        A link from a reference field on one table to a record in another.

        ``to_field`` is omitted when the link points at the target record itself (the usual
        case); when set, it must be a unique field on the target table.
      properties:
        id:
          pattern: ^rel_[a-z0-9_]{3,48}$
          title: Id
          type: string
        from_table:
          pattern: ^tbl_[a-z0-9_]{3,48}$
          title: From Table
          type: string
        from_field:
          pattern: ^fld_[a-z0-9_]{3,48}$
          title: From Field
          type: string
        to_table:
          pattern: ^tbl_[a-z0-9_]{3,48}$
          title: To Table
          type: string
        to_field:
          anyOf:
          - pattern: ^fld_[a-z0-9_]{3,48}$
            type: string
          - type: 'null'
          default: null
          title: To Field
        cardinality:
          $ref: '#/components/schemas/Cardinality'
          default: many_to_one
        optional:
          title: Optional
          type: boolean
        on_delete:
          $ref: '#/components/schemas/DeletePolicy'
          default: restrict
        description:
          maxLength: 120
          minLength: 1
          title: Description
          type: string
      required:
      - id
      - from_table
      - from_field
      - to_table
      - optional
      - description
      title: Relationship
      type: object
    RoleEnum:
      enum:
      - owner
      - admin
      - editor
      - viewer
      type: string
      description: |-
        * `owner` - Owner
        * `admin` - Admin
        * `editor` - Editor
        * `viewer` - Viewer
    SSD:
      additionalProperties: false
      description: A complete Syntropy Schema Definition document.
      properties:
        spec_version:
          const: '1.0'
          title: Spec Version
          type: string
        workspace_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          default: null
          title: Workspace Id
        version:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Version
        status:
          allOf:
          - $ref: '#/components/schemas/SSDStatusEnum'
          default: draft
          title: Status
        tables:
          items:
            $ref: '#/components/schemas/Table'
          maxItems: 100
          minItems: 1
          title: Tables
          type: array
        relationships:
          default: []
          items:
            $ref: '#/components/schemas/Relationship'
          maxItems: 500
          title: Relationships
          type: array
        source_mappings:
          default: []
          items:
            $ref: '#/components/schemas/SourceMapping'
          maxItems: 5000
          title: Source Mappings
          type: array
      required:
      - spec_version
      - tables
      title: SSD
      type: object
    SSDStatusEnum:
      enum:
      - draft
      - published
      - superseded
      type: string
    Session:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          oneOf:
          - $ref: '#/components/schemas/User'
          - type: 'null'
      required:
      - authenticated
      - user
    SourceMapping:
      additionalProperties: false
      description: Links one column of an uploaded file to a field (spec section 8).
      properties:
        id:
          pattern: ^map_[a-z0-9_]{3,48}$
          title: Id
          type: string
        source_file:
          maxLength: 120
          minLength: 1
          title: Source File
          type: string
        sheet:
          anyOf:
          - maxLength: 120
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Sheet
        column:
          maxLength: 120
          minLength: 1
          title: Column
          type: string
        table:
          pattern: ^tbl_[a-z0-9_]{3,48}$
          title: Table
          type: string
        field:
          pattern: ^fld_[a-z0-9_]{3,48}$
          title: Field
          type: string
        transform:
          $ref: '#/components/schemas/Transform'
          default: none
      required:
      - id
      - source_file
      - column
      - table
      - field
      title: SourceMapping
      type: object
    SyncBatchRequest:
      type: object
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperationRequest'
      required:
      - operations
    SyncError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - code
      - message
    SyncOperationRequest:
      type: object
      properties:
        idempotency_key:
          type: string
          format: uuid
          description: Generated once on the device when the change is queued; reused
            on retries.
        op:
          allOf:
          - $ref: '#/components/schemas/OpEnum'
          description: |-
            Deletes always need a connection, so they are never queued.

            * `create` - create
            * `update` - update
        table_id:
          type: string
          minLength: 1
          pattern: ^tbl_[a-z0-9_]{3,48}$
        record_id:
          type: string
          format: uuid
          description: For a create, the client-generated ID (UUIDv7) the device already
            uses.
        base_version:
          type: integer
          minimum: 1
          description: 'For an update: the record version the change was based on.'
        schema_version:
          type: integer
          minimum: 1
          description: The schema version the form was validated against.
        values:
          type: object
          additionalProperties:
            oneOf:
            - {}
            - type: 'null'
      required:
      - idempotency_key
      - op
      - record_id
      - schema_version
      - table_id
      - values
    SyncResponse:
      type: object
      properties:
        schema_version:
          type: integer
          description: The workspace's active schema version.
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncResult'
      required:
      - results
      - schema_version
    SyncResult:
      type: object
      properties:
        idempotency_key:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SyncResultStatusEnum'
        replayed:
          type: boolean
          description: True when this key was seen before and the stored outcome is
            returned.
        record:
          allOf:
          - $ref: '#/components/schemas/Record'
          description: The saved record (applied).
        current:
          allOf:
          - $ref: '#/components/schemas/Record'
          description: The record as it is now on the server (conflict).
        error:
          $ref: '#/components/schemas/SyncError'
      required:
      - idempotency_key
      - replayed
      - status
    SyncResultStatusEnum:
      enum:
      - applied
      - conflict
      - rejected
      - schema_changed
      type: string
      description: |-
        * `applied` - applied
        * `conflict` - conflict
        * `rejected` - rejected
        * `schema_changed` - schema_changed
    Table:
      additionalProperties: false
      properties:
        id:
          pattern: ^tbl_[a-z0-9_]{3,48}$
          title: Id
          type: string
        key:
          maxLength: 63
          pattern: ^[a-z][a-z0-9]*(_[a-z0-9]+)*$
          title: Key
          type: string
        label:
          maxLength: 120
          minLength: 1
          title: Label
          type: string
        description:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          default: null
          title: Description
        icon:
          anyOf:
          - maxLength: 64
            pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
            type: string
          - type: 'null'
          default: null
          title: Icon
        fields:
          items:
            $ref: '#/components/schemas/FieldDef'
          maxItems: 200
          minItems: 1
          title: Fields
          type: array
      required:
      - id
      - key
      - label
      - fields
      title: Table
      type: object
    TableSummary:
      type: object
      properties:
        table_id:
          type: string
        record_count:
          type: integer
        last_updated:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - last_updated
      - record_count
      - table_id
    Transform:
      description: Deterministic transforms applied to a source value during import
        (Phase 4).
      enum:
      - none
      - trim
      - parse_integer
      - parse_decimal
      - parse_money
      - parse_date_day_first
      - parse_date_month_first
      - parse_datetime
      - parse_boolean
      - enum_lookup
      - link_lookup
      title: Transform
      type: string
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        first_name:
          type: string
        email:
          type: string
      required:
      - email
      - first_name
      - id
      - username
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        status:
          allOf:
          - $ref: '#/components/schemas/WorkspaceStatusEnum'
          readOnly: true
        timezone:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - currency
      - id
      - name
      - organization_name
      - role
      - slug
      - status
      - timezone
    WorkspaceCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        organization_name:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - name
    WorkspaceStatusEnum:
      enum:
      - setup
      - active
      - archived
      type: string
      description: |-
        * `setup` - Being set up
        * `active` - Active
        * `archived` - Archived
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
