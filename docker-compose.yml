# Local development services (spec section 6, "Environments").
#
#   docker compose up -d                  -> PostgreSQL, Redis, MinIO only (run Django and Vite yourself)
#   docker compose --profile app up -d    -> also Django, a Celery worker and the Vite dev server
#
# Credentials here are for local development only.
name: syntropy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: syntropy
      POSTGRES_USER: syntropy
      POSTGRES_PASSWORD: syntropy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syntropy -d syntropy"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: syntropy
      MINIO_ROOT_PASSWORD: syntropy-dev-secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console: http://localhost:9001
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the private uploads bucket once MinIO is up, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 syntropy syntropy-dev-secret &&
      mc mb --ignore-existing local/syntropy-uploads &&
      mc anonymous set none local/syntropy-uploads
      "

  backend:
    profiles: ["app"]
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment: &backend-env
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgres://syntropy:syntropy@db:5432/syntropy
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: syntropy
      S3_SECRET_KEY: syntropy-dev-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build: ./backend
    command: celery -A config worker --loglevel=info
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
  frontend_node_modules:
