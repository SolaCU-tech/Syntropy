name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, OpenAPI, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: syntropy
          POSTGRES_USER: syntropy
          POSTGRES_PASSWORD: syntropy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U syntropy -d syntropy"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://syntropy:syntropy@localhost:5432/syntropy
      DJANGO_SETTINGS_MODULE: config.settings_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Django system checks
        run: python manage.py check
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is up to date
        run: |
          python manage.py spectacular --file schema.yml --validate
          git diff --exit-code schema.yml || (echo "::error::backend/schema.yml is stale. Run: python manage.py spectacular --file schema.yml" && exit 1)
      - name: Tests
        run: pytest --cov=apps --cov=config --cov-report=term-missing

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match the backend schema
        run: |
          npm run api:types
          git diff --exit-code src/api/types.ts || (echo "::error::src/api/types.ts is stale. Run: npm run api:types" && exit 1)
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (offline sync journeys)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: syntropy
          POSTGRES_USER: syntropy
          POSTGRES_PASSWORD: syntropy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U syntropy -d syntropy"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://syntropy:syntropy@localhost:5432/syntropy
      DJANGO_DEBUG: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the backend with demo data
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py migrate --verbosity 0
          python manage.py seed_demo
          nohup python manage.py runserver 8000 > ../django.log 2>&1 &
      - name: Build and serve the app
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 4173 --strictPort > ../preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/api/health/ && exit 0; sleep 2; done
          cat ../django.log ../preview.log; exit 1
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            django.log
          retention-days: 7

  compose:
    name: Docker Compose (config, pull, start)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose --profile app config --quiet
      - name: Every image in docker-compose.yml can be pulled
        run: docker compose pull
      - name: Infrastructure services start and become healthy
        run: |
          docker compose up -d --wait --wait-timeout 120 db redis minio
          for i in $(seq 1 15); do docker compose run --rm minio-init && exit 0; sleep 2; done
          exit 1
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs
